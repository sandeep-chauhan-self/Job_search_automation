# YOUR answers to common application questions.
#
# WARNING: these values are typed into REAL job applications verbatim.
# Every number below is a placeholder - replace them with your own or delete
# the entry. A wrong value here is a false statement to an employer.
#
# Fields:
#   pattern              substring matched against the question (case-insensitive)
#   answer               what gets submitted
#   type                 number | text | radio | select
#   generic: true        mark broad patterns. The answer is then skipped when the
#                        question names a specific technology or company, so
#                        "years of experience with Kubernetes" never gets your
#                        overall experience number.
#   exclude_if_contains  skip this entry when the question contains any of these
#
# Anything with no match here is answered from config/profile.yaml by the LLM,
# which is instructed to answer 0/No rather than invent experience.

- pattern: "years of experience"
  answer: "3"                 # profile.yaml states "3+ years" - using the certain
                                # floor, not a rounded-up guess
  type: "number"
  generic: true

- pattern: "authorized to work"
  answer: "Yes"                # assumes Indian work authorization - every
                                # target location in profile.yaml is India-based
  type: "radio"

- pattern: "require sponsorship"
  answer: "No"
  type: "radio"

- pattern: "visa sponsorship"
  answer: "No"
  type: "radio"

- pattern: "willing to relocate"
  answer: "Yes"                # career_preferences.location_preference lists
                                # Pune, Gurugram, and Noida beyond Bengaluru
  type: "radio"

- pattern: "expected salary"
  answer: "1500000"            # 15 lakh, as given
  type: "number"

- pattern: "current salary"
  answer: "1100000"            # 11 lakh, as given
  type: "number"

- pattern: "notice period"
  answer: "2 months"
  type: "text"
  exclude_if_contains: ["negotiable"]   # "is your notice period negotiable?" is a
                                          # yes/no question - "2 months" would be typed
                                          # into a radio field and rejected or wrong.
                                          # Falls through to manual/LLM instead.

- pattern: "current location"
  answer: "Bengaluru, India"
  type: "text"

- pattern: "current employer"
  answer: "Honeywell"
  type: "text"

- pattern: "current company"
  answer: "Honeywell"
  type: "text"

- pattern: "linkedin"
  answer: "https://linkedin.com/in/sandeep-chauhan-243012181"
  type: "text"

- pattern: "github"
  answer: "https://github.com/sandeep-chauhan-self"
  type: "text"

- pattern: "highest qualification"
  answer: "Bachelor's Degree - B.Tech, Computer Science Engineering"
  type: "text"

- pattern: "highest degree"
  answer: "Bachelor's Degree - B.Tech, Computer Science Engineering"
  type: "text"

- pattern: "immediate joiner"
  answer: "No"                 # matches your 2-month notice period
  type: "radio"

- pattern: "willing to travel"
  answer: "Yes"
  type: "radio"

- pattern: "reason for leaving"
  answer: "Looking for a role with greater ownership over backend and agentic AI/LLM engineering work, building on the production and safety-critical experience I've gained at Honeywell."
  type: "text"                 # FIRST DRAFT - this is the one entry here that's
                                 # your voice, not a fact. Edit it before relying on it.

- pattern: "reason for job change"
  answer: "Looking for a role with greater ownership over backend and agentic AI/LLM engineering work, building on the production and safety-critical experience I've gained at Honeywell."
  type: "text"

