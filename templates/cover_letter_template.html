<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ name }} - Cover Letter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 2.5cm;
            font-size: 11pt;
        }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 20pt; margin: 0 0 10px 0; }
        .contact { color: #555; font-size: 10pt; }
        .date-company { margin-bottom: 30px; }
        .content p { margin-bottom: 15px; }
        .signoff { margin-top: 40px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>{{ name }}</h1>
        <div class="contact">
            {{ email }} | {{ phone }} | {{ location }}<br>
            {{ linkedin_url }}
        </div>
    </div>

    <div class="date-company">
        <strong>{{ date }}</strong><br><br>
        Hiring Manager<br>
        {{ company }}<br>
        Application for {{ job_title }}
    </div>

    <div class="content">
        {{ body | replace('\n', '<br>') | safe }}
    </div>

    <div class="signoff">
        Sincerely,<br><br>
        <strong>{{ name }}</strong>
    </div>

</body>
</html>
